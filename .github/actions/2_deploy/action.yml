name: 'Deploy'
description: 'Deploy'

inputs:
  use-brew-qt:
    description: 'Qt Option'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Set Qt option
      id: envs
      shell: bash
      run: |
        if [ "${{ inputs.use-brew-qt }}" == "true" ]; then
          echo "qt-option=--use_brew_qt" >> $GITHUB_OUTPUT
        else
          echo "qt-option=" >> $GITHUB_OUTPUT
        fi
    - name: Deploy
      env:
        QT_OPTION: ${{ steps.envs.outputs.qt-option }}
      shell: bash
      run: |
        set -euo pipefail
        # Record the source commit before deployment seals the AppImage.
        git rev-parse HEAD > install/BUILD_COMMIT.txt
        # macOS ships Bash 3.2: an empty array with nounset is an error.
        # Keep the command nonempty and preserve each argument's quoting.
        set -- bash "scripts/${RUNNER_OS}/2_deploy.sh"
        if [[ "$RUNNER_OS" == Windows ]]; then set -- "$@" --portable-only; fi
        if [[ -n "$QT_OPTION" ]]; then set -- "$@" "$QT_OPTION"; fi
        "$@"
