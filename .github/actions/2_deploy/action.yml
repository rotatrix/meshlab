name: 'Deploy'
description: 'Deploy'

inputs:
  mac-certificate:
    description: 'MacOS Certificate'
    required: false
    default: ''
  mac-certificate-id:
    description: 'MacOS Certificate ID'
    required: false
    default: ''
  mac-certificate-pssw:
    description: 'MacOS Certificate Password'
    required: false
  mac-notarization-user:
    description: 'MacOS Notarization User'
    required: false
    default: ''
  mac-notarization-team:
    description: 'MacOS Notarization Team'
    required: false
    default: ''
  mac-notarization-pssw:
    description: 'MacOS Notarization Password'
    required: false
    default: ''
  win-certificate:
    description: 'Windows Certificate'
    required: false
    default: ''
  win-certificate-pssw:
    description: 'Windows Certificate Password'
    required: false
    default: ''
  use-brew-qt:
    description: 'Qt Option'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Set Notarization settings
      id: envs
      shell: bash
      run: |
        if [ "${{ inputs.use-brew-qt }}" == "true" ]; then
          echo "qt-option=--use_brew_qt" >> $GITHUB_OUTPUT
        else
          echo "qt-option=" >> $GITHUB_OUTPUT
        fi
    - name: Deploy
      env:
        WIN_CERTIFICATE: ${{ inputs.win-certificate }}
        WIN_PASSWORD: ${{ inputs.win-certificate-pssw }}
      shell: bash
      run: |
        set -euo pipefail
        args=()
        if [[ "$RUNNER_OS" == Windows && -n "$WIN_CERTIFICATE" ]]; then
          certificate=$(mktemp "$RUNNER_TEMP/meshlab-signing-XXXXXX.pfx")
          trap 'rm -f "$certificate"' EXIT
          printf '%s' "$WIN_CERTIFICATE" | base64 --decode > "$certificate"
          args+=("--cert_file=$certificate" "--cert_pssw=$WIN_PASSWORD")
        fi
        bash scripts/${{ runner.os }}/2_deploy.sh ${{ steps.envs.outputs.qt-option }} "${args[@]}"
    - name: Verify Windows signatures
      if: runner.os == 'Windows' && inputs.win-certificate != ''
      shell: pwsh
      run: |
        $files = Get-ChildItem install,packages -Recurse -File | Where-Object { $_.Extension -in '.exe','.dll' }
        foreach ($file in $files) {
          if ((Get-AuthenticodeSignature -LiteralPath $file.FullName).Status -ne 'Valid') {
            throw "Signature verification failed: $($file.Name)"
          }
        }
    - name: Sign and Notarize
      if: runner.os == 'macOS' && inputs.mac-certificate != ''
      uses: cnr-isti-vclab/sign-and-notarize@v1
      with:
        input-path: 'install/*.app'
        macos-certificate: '${{ inputs.mac-certificate }}'
        macos-certificate-id: '${{ inputs.mac-certificate-id }}'
        macos-certificate-password: '${{ inputs.mac-certificate-pssw }}'
        macos-notarization-team: '${{ inputs.mac-notarization-team }}'
        macos-notarization-user: '${{ inputs.mac-notarization-user }}'
        macos-notarization-password: '${{ inputs.mac-notarization-pssw }}'
        # windows-certificate: '${{ inputs.win-certificate }}'
        # windows-certificate-password: '${{ inputs.win-certificate-pssw }}'
    - name: DMG
      shell: bash
      if: ${{ runner.os == 'macOS' }}
      run: |
        bash scripts/${{ runner.os }}/3_dmg.sh
