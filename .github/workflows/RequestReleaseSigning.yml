# Copy into the source repo's .github/workflows/ on its DEFAULT branch.
name: Request release signing
on:
  workflow_run:
    workflows: ['Rotatrix release']
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  request:
    if: >-
      github.repository_owner == 'rotatrix' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    environment: signing-dispatch
    steps:
      # No checkout and no execution of code from the source artifact.
      - name: Dispatch each release app artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNER_DISPATCH_TOKEN: ${{ secrets.SIGNER_DISPATCH_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          event = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          run = event["workflow_run"]
          repo = event["repository"]["full_name"]
          tag = run["head_branch"]
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]*-rotatrix\.[1-9][0-9]*(?:-(?:alpha|beta|rc)\.[1-9][0-9]*)?", tag):
              print("Not a release-tag build; nothing to sign.")
              raise SystemExit(0)
          pages = json.loads(subprocess.check_output([
              "gh", "api", "--paginate", "--slurp",
              f"repos/{repo}/actions/runs/{run['id']}/artifacts"], text=True))
          artifacts = [a for p in pages for a in p["artifacts"]
                       if re.fullmatch(r"macos-app-[A-Za-z0-9][A-Za-z0-9._-]{0,140}\.tar\.gz", a["name"])]
          if not artifacts:
              raise SystemExit("Release build has no standard macOS app artifacts")
          if not os.environ.get("SIGNER_DISPATCH_TOKEN"):
              raise SystemExit("Set SIGNER_DISPATCH_TOKEN in the signing-dispatch environment")
          for artifact in artifacts:
              payload = {"ref": "main", "inputs": {
                  "source_repository": repo, "source_run_id": str(run["id"]),
                  "artifact_id": str(artifact["id"]), "release_tag": tag, "publish": True}}
              subprocess.run(["gh", "api", "--method", "POST",
                  "repos/rotatrix/release-signing/actions/workflows/sign-macos.yml/dispatches",
                  "--input", "-"], input=json.dumps(payload), text=True, check=True,
                  env={**os.environ, "GH_TOKEN": os.environ["SIGNER_DISPATCH_TOKEN"]})
          PY
