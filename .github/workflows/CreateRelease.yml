name: Rotatrix release

on:
  push:
    tags: ['*-rotatrix.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate immutable release tag and source
        id: tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAC_CERT: ${{ secrets.MACOS_CERTIFICATE }}
          MAC_ID: ${{ secrets.MACOS_CERT_ID }}
          MAC_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PSSW }}
          MAC_USER: ${{ secrets.MACOS_NOTARIZATION_USER }}
          MAC_TEAM: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
          MAC_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PSSW }}
          WIN_CERT: ${{ secrets.WIN_CERTIFICATE }}
          WIN_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PSSW }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^(.+)-rotatrix\.([1-9][0-9]*)(-beta\.([1-9][0-9]*))?$ ]] || { echo 'Invalid release tag'; exit 1; }
          base="${BASH_REMATCH[1]}"
          prerelease=false
          [[ -z "${BASH_REMATCH[3]}" ]] || prerelease=true
          git rev-parse --verify "refs/tags/$base^{commit}"
          git merge-base --is-ancestor "refs/tags/$base" HEAD
          if [[ "$prerelease" == false ]]; then
            git merge-base --is-ancestor HEAD "refs/remotes/origin/rotatrix/$base"
            for variable in MAC_CERT MAC_ID MAC_PASSWORD MAC_USER MAC_TEAM MAC_NOTARY_PASSWORD WIN_CERT WIN_PASSWORD; do
              [[ -n "${!variable}" ]] || { echo "Required signing setting missing: $variable"; exit 1; }
            done
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; never replace shipped assets.'; exit 1
          fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
  build:
    needs: validate
    uses: ./.github/workflows/BuildMeshLab.yml
    with:
      release-build: true
    secrets: inherit
  release:
    needs: [validate, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: MeshLab-*-${{ github.sha }}
          path: artifacts
      - name: Publish tagged packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          # Preserve upstream installers/AppImages/DMGs and portable bundles.
          # Prefix the unique artifact directory to prevent package-name collisions.
          while IFS= read -r -d '' file; do
            directory=$(basename "$(dirname "$file")")
            cp "$file" "release-assets/$directory-$(basename "$file")"
          done < <(find artifacts -type f -print0)
          args=()
          if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag "${args[@]}" \
            --title "MeshLab $RELEASE_TAG" --notes "Rotatrix/OpenAxis build from $GITHUB_SHA. Beta builds may be unsigned."
