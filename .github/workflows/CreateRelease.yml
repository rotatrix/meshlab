name: Rotatrix release

on:
  push:
    tags: ['*-rotatrix.*']
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing immutable MeshLab release tag
        type: string
        required: true
      create-tag-at:
        description: Optional exact approved build SHA at which to create a new immutable tag
        type: string
        required: false
      build-run-id:
        description: Successful full-platform trusted build at the exact tagged SHA
        type: string
        required: true
      publish:
        description: Create draft and request signing (requires deployed signer transition)
        type: boolean
        default: false
      source-and-package-acceptance:
        description: Package acceptance and repository-based source references reviewed for this SHA
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  attestations: read

concurrency:
  group: release-${{ inputs.release-tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == 'rotatrix/meshlab' &&
      (github.event_name == 'push' ||
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      attestations: read
    outputs:
      artifact-id: ${{ steps.prepared.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test promotion checks
        run: python3 -m unittest discover -s tests/rotatrix -v
      - name: Create explicitly requested immutable tag
        if: github.event_name == 'workflow_dispatch' && inputs.create-tag-at != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          SOURCE_SHA: ${{ inputs.create-tag-at }}
          BUILD_RUN_ID: ${{ inputs.build-run-id }}
        shell: bash
        run: |
          python3 - <<'PYTAG'
          import json, os, re, subprocess, sys
          sys.path.insert(0, 'scripts/rotatrix')
          import promote
          sha, tag = os.environ['SOURCE_SHA'], os.environ['RELEASE_TAG']
          promote.require(re.fullmatch(r'[0-9a-f]{40}', sha) and promote.TAG.fullmatch(tag), 'Invalid tag/SHA')
          promote.validate_run(promote.api('actions/runs/' + os.environ['BUILD_RUN_ID']), sha)
          subprocess.run(['gh', 'api', '--method', 'POST', 'repos/rotatrix/meshlab/git/refs', '--input', '-'],
                         input=json.dumps({'ref': 'refs/tags/' + tag, 'sha': sha}), text=True, check=True)
          PYTAG
      - name: Verify original build and stage unchanged artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag || github.ref_name }}
          BUILD_RUN_ID: ${{ inputs.build-run-id }}
        shell: bash
        run: |
          set -euo pipefail
          args=(prepare --tag "$RELEASE_TAG")
          if [[ -n "$BUILD_RUN_ID" ]]; then args+=(--run-id "$BUILD_RUN_ID"); fi
          python3 scripts/rotatrix/promote.py "${args[@]}"
      - name: Retain verified promotion evidence
        id: prepared
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verified-promotion-${{ github.run_id }}
          path: promotion/*
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

  draft-and-sign:
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.publish &&
      inputs.source-and-package-acceptance && vars.ROTATRIX_PROMOTION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          path: promotion
          digest-mismatch: error
      - name: Create draft and dispatch verified original macOS artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNER_DISPATCH_TOKEN: ${{ secrets.SIGNER_DISPATCH_TOKEN }}
          ROTATRIX_PROMOTION_ENABLED: ${{ vars.ROTATRIX_PROMOTION_ENABLED }}
          SOURCE_ACCEPTANCE: ${{ inputs.source-and-package-acceptance }}
        run: python3 scripts/rotatrix/promote.py publish
