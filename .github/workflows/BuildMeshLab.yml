name: BuildMeshLab

on:
  push:
    branches: ['rotatrix/**']
  pull_request:
    branches: ['rotatrix/**']
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build (use macos for focused packaging retries)
        type: choice
        options: [all, macos]
        default: all

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: meshlab-${{ github.workflow }}-${{ github.ref }}
  # Let healthy builds finish and save dependency caches before the next run.
  cancel-in-progress: false

env:
  QT_VERSION: 5.15.2

jobs:
  meshlab_build:
    name: MeshLab ${{ matrix.os }} ${{ matrix.precision }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms == 'macos' && '["macos-15-intel","macos-15"]' || '["ubuntu-22.04","ubuntu-22.04-arm","macos-15-intel","macos-15","windows-2022"]') }}
        precision: [single_precision]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select validated macOS toolchain
        if: runner.os == 'macOS'
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
      - name: Setup Environment
        uses: ./.github/actions/0_setup
        with:
          qt-version: ${{ env.QT_VERSION }}
          use-jurpel-qt-action: ${{ matrix.os != 'macos-15' && runner.os != 'Linux' }}
      - name: OpenAxis build dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install cmake==3.31.6 ninja
          if [[ "$RUNNER_OS" == Linux ]]; then sudo apt-get install -y libssl-dev xvfb; fi
          if [[ "$RUNNER_OS" == macOS ]]; then brew install openssl@3; fi
      - name: Packaging and promotion regression tests
        run: python -m unittest discover -s tests/rotatrix -v
      - name: Setup build options
        id: envs
        shell: bash
        run: |
          set -euo pipefail
          arch=$(uname -m)
          case "$arch" in x86_64) arch=x64;; aarch64) arch=arm64;; esac
          echo "artifact_suffix=$arch-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
          if [[ "${{ matrix.os }}" == macos-15 ]]; then
            echo 'build_options=--use_brew_qt' >> "$GITHUB_OUTPUT"
            echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@5)" >> "$GITHUB_ENV"
          else
            echo 'build_options=' >> "$GITHUB_OUTPUT"
          fi
          if [[ "$RUNNER_OS" == macOS ]]; then
            echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          fi
      - name: Build
        uses: ./.github/actions/1_build
        with:
          cache-path: src/external/downloads/*
          cache-key: external-libraries
          build-precision: ${{ matrix.precision }}
          build-options: ${{ steps.envs.outputs.build_options }}
          nightly: false
      - name: OpenAxis regression tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tests/openaxis -B build-tests -G Ninja -DCMAKE_BUILD_TYPE=Release -DOPENAXIS_SOURCE_DIR="$PWD/build/_deps/openaxis-src"
          cmake --build build-tests
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a ctest --test-dir build-tests --output-on-failure
          else
            ctest --test-dir build-tests --output-on-failure
          fi
      - name: Deploy upstream packages
        uses: ./.github/actions/2_deploy
        with:
          use-brew-qt: ${{ matrix.os == 'macos-15' }}
          win-certificate: ${{ github.repository == 'rotatrix/meshlab' && github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/rotatrix/') && secrets.WIN_CERTIFICATE || '' }}
          win-certificate-pssw: ${{ github.repository == 'rotatrix/meshlab' && github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/rotatrix/') && secrets.WIN_CERTIFICATE_PSSW || '' }}
      - name: Package and smoke-test macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == macos-15 ]]; then export QT_ROOT="$(brew --prefix qt@5)"; fi
          bash scripts/macOS/3_pack_app.sh install/meshlab.app build portable "${{ steps.envs.outputs.artifact_suffix }}"
      - name: Upload macOS app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: portable/macos-app-*.tar.gz
          archive: false
          retention-days: 14
          if-no-files-found: error
      - name: Source provenance and portable archive
        if: runner.os != 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > install/BUILD_COMMIT.txt
          cp docs/OpenAxis.md docs/OpenAxis.rotatrix.yaml install/
          mkdir -p portable
          name="MeshLab-${RUNNER_OS,,}-${{ steps.envs.outputs.artifact_suffix }}"
          if [[ "$RUNNER_OS" == Windows ]]; then
            7z a "portable/$name.zip" ./install/*
          else
            tar -czf "portable/$name.tar.gz" -C install .
            cp packages/MeshLab*.AppImage "portable/$name.AppImage"
          fi
      - name: Upload MeshLab Portable
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: portable/${{ runner.os == 'Windows' && '*.zip' || '*.tar.gz' }}
          archive: false
          retention-days: 14
          if-no-files-found: error
      - name: Upload MeshLab Packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: portable/*.AppImage
          archive: false
          retention-days: 14
          if-no-files-found: error
      - name: Preserve build sources
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: python3 scripts/rotatrix/build_record.py sources
      - name: Record package hashes and configuration
        env:
          WINDOWS_SIGNED: ${{ runner.os == 'Windows' && github.repository == 'rotatrix/meshlab' && github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/rotatrix/') && secrets.WIN_CERTIFICATE != '' && secrets.WIN_CERTIFICATE_PSSW != '' }}
        shell: bash
        run: python scripts/rotatrix/build_record.py record --platform '${{ matrix.os }}'
      - name: Attest trusted build outputs
        if: >-
          github.repository == 'rotatrix/meshlab' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          startsWith(github.ref, 'refs/heads/rotatrix/')
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            portable/*
            provenance/*
      - name: Upload build record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: provenance/build-*.json
          archive: false
          retention-days: 14
          if-no-files-found: error
      - name: Upload build sources
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: portable/MeshLab-sources-*.tar.gz
          archive: false
          retention-days: 14
          if-no-files-found: error
