name: OpenAxis desktop builds

on:
  push:
    branches: [rotatrix/main]
  pull_request:
    branches: [rotatrix/main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openaxis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CMake
        run: python -m pip install cmake==3.31.6 ninja
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          cache: true
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa-dev libssl-dev libxkbcommon-x11-0 libxcb-xinerama0 libxcb-cursor0 xvfb
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install libomp openssl@3
      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          extra=()
          if [[ "$RUNNER_OS" == macOS ]]; then extra+=("-DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)"); fi
          cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/install" -DMESHLAB_OPENAXIS=ON \
            -DMESHLAB_ALLOW_OPTIONAL_EXTERNAL_LIBRARIES=OFF -DVCG_ALLOW_SYSTEM_EIGEN=OFF "${extra[@]}"
      - name: Build and install
        run: cmake --build build-ci --parallel 3
      - run: cmake --install build-ci
      - name: Camera, picking, visual diagnostics and scheduler tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tests/openaxis -B build-tests -G Ninja -DCMAKE_BUILD_TYPE=Release -DOPENAXIS_SOURCE_DIR="$PWD/build-ci/_deps/openaxis-src"
          cmake --build build-tests
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a ctest --test-dir build-tests --output-on-failure
          else
            ctest --test-dir build-tests --output-on-failure
          fi
      - name: Deploy Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          windeployqt --release --compiler-runtime install/meshlab.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $crt = Join-Path $env:VCToolsRedistDir 'x64/Microsoft.VC143.CRT/*.dll'
          Copy-Item $crt install/
          Copy-Item LICENSE.txt install/
          Copy-Item docs/OpenAxis.md,docs/OpenAxis.rotatrix.yaml install/
      - name: Deploy macOS runtime
        if: runner.os == 'macOS'
        run: macdeployqt install/meshlab.app -always-overwrite
      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # Qt is distributed with this portable preview; system GL and X11 remain host dependencies.
          mkdir -p install/lib/qt install/plugins
          cp -a "$QT_ROOT_DIR/lib/"*.so* install/lib/qt/
          cp -a "$QT_ROOT_DIR/plugins/platforms" "$QT_ROOT_DIR/plugins/imageformats" install/plugins/
          cat > install/MeshLab.sh <<'EOF'
          #!/bin/sh
          ROOT=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          export LD_LIBRARY_PATH="$ROOT/lib/qt:$ROOT/lib/meshlab${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export QT_PLUGIN_PATH="$ROOT/plugins"
          exec "$ROOT/bin/meshlab" "$@"
          EOF
          chmod +x install/MeshLab.sh
          cp LICENSE.txt docs/OpenAxis.md docs/OpenAxis.rotatrix.yaml install/
      - name: Package loader smoke check
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Windows) ./install/meshlab.exe --version ;;
            macOS) ./install/meshlab.app/Contents/MacOS/meshlab --version ;;
            Linux) env -u LD_LIBRARY_PATH -u QT_PLUGIN_PATH ./install/MeshLab.sh --version ;;
          esac
      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages
          echo "$GITHUB_SHA" > install/BUILD_COMMIT.txt
          if [[ "$RUNNER_OS" == Windows ]]; then
            7z a "packages/MeshLab-OpenAxis-Windows-x64.zip" ./install/*
          else
            tar -czf "packages/MeshLab-OpenAxis-${RUNNER_OS}-x64.tar.gz" -C install .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: MeshLab-OpenAxis-${{ runner.os }}
          path: packages/*
          if-no-files-found: error

  draft-release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/rotatrix/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: MeshLab-OpenAxis-*
          path: packages
          merge-multiple: true
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="openaxis-preview-$GITHUB_SHA"
          cat > notes.md <<EOF
          MeshLab OpenAxis preview from $GITHUB_SHA.

          Windows x64, Linux x64 and macOS Intel builds with OpenAxis cpp/v1.0.0-rc.1.
          Uses MeshLab's bundled/core plugins; optional external-library plugins are omitted.
          Start Rotatrix 1.6+ with an app.meshlab profile. Ctrl+Shift+O opens diagnostics with reconnect and log controls.
          Builds are unsigned. Device navigation and GUI testing are required before publishing.

          Build run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
            gh release upload "$tag" packages/* --clobber
          else
            gh release create "$tag" packages/* --draft --prerelease --target "$GITHUB_SHA" \
              --title "MeshLab OpenAxis preview ${GITHUB_SHA:0:12}" --notes-file notes.md
          fi
